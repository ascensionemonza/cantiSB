<!DOCTYPE html>
<html lang="it">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
  body {
    font-family: Arial, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 0px;
  }

  .button-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 15px 20px;
    width: 100%;
    max-width: 500px;
  }

  .button-grid a {
    display: block;
    padding: 12px 0;
    text-align: center;
    background-color: #BF8F00;
    color: white;
    text-decoration: none;
    border-radius: 80px;
    font-weight: normal;
  }

  .button-grid a:hover {
    background-color: #00b300;
    color: white;
  }
</style>

<script>

// Recupera la dimensione salvata
let size = parseInt(localStorage.getItem("dimTesto")) || 16;

// Funzione unica che applica il font ovunque
function applicaFont() {

    const contenuto = document.getElementById("contenuto");

    if (contenuto) {

        contenuto.style.fontSize = size + "px";

        contenuto.querySelectorAll("*").forEach(el => {
            el.style.fontSize = size + "px";
        });
    }

    const testo = document.getElementById("testoDimensione");

    if (testo) {
        testo.style.fontSize = size + "px";
    }
}

// Applica il font quando la pagina è pronta
document.addEventListener("DOMContentLoaded", applicaFont);

// Ridimensionamento colonne tabelle
function applicaDimensioneColonne(fontSize, multiplier) {

    const baseWidth = fontSize * multiplier;

    const tabelle = document.querySelectorAll("#contenuto table");

    tabelle.forEach(tab => {

        const colgroup = tab.querySelectorAll("col");

        if (colgroup.length > 0) {

            colgroup.forEach(col => {
                col.style.width = baseWidth + "px";
            });

        } else {

            const celle =
                tab.querySelectorAll("tr:first-child td, tr:first-child th");

            celle.forEach(c => {
                c.style.width = baseWidth + "px";
            });
        }
    });
}

</script>

</head>

<body>

<span style="color:#BF8F00">
<h1><div id="header"></div></h1>
</span>

<div id="contenuto"></div>

<div id="footer" class="button-grid"></div>

<script>

function codice(numero) {

    if (!numero) return null;

    numero = numero.toUpperCase().replace(/\s+/g, "");

    const iniziale = numero.charAt(0);

    if (/^[A-Z]/.test(iniziale)) {
        return numero.charAt(0) +
               numero.substring(1).padStart(2, "0");
    }

    const match = numero.match(/^(\d+)/);

    if (match) {
        return match[1].padStart(3, "0") +
               numero.substring(match[1].length);
    }

    return numero;
}

function haCanto(liturgia) {
    return liturgia && liturgia.canto;
}

function cantoPrincipale(codice) {

    if (!codice) {
        return false;
    }

    return codice.trim().length <= 4;
}

const urlParams = new URLSearchParams(window.location.search);
const momento = Number(urlParams.get("n"));

fetch("config/liturgie.json")
    .then(r => r.json())
    .then(data => {

        const liturgie = data.liturgie;

        const corrente = liturgie[momento];

        if (!corrente || !haCanto(corrente)) {
            document.getElementById("contenuto").innerHTML =
                "<h2>Nessun canto associato a questo momento.</h2>";
            return;
        }

        let prev_i = -1;
        let next_i = -1;

        for (let i = momento - 1; i >= 0; i--) {

            if (
                haCanto(liturgie[i]) &&
                cantoPrincipale(liturgie[i].canto)
            ) {
                prev_i = i;
                break;
            }
        }

        for (let i = momento + 1; i < liturgie.length; i++) {

            if (
                haCanto(liturgie[i]) &&
                cantoPrincipale(liturgie[i].canto)
            ) {
                next_i = i;
                break;
            }
        }

        const file =
            "canti/" +
            codice(corrente.canto) +
            ".html";

        fetch(file)
            .then(r => {

                if (!r.ok) {
                    throw new Error("File non trovato");
                }

                return r.text();
            })
            .then(html => {

                document.getElementById("header").innerHTML =
                    corrente.momento;

                document.getElementById("contenuto").innerHTML =
                    html;

                applicaFont();

                let precedente;

                if (prev_i === -1) {
                    precedente = '<a href="index.html">-</a>';
                } else {
                    precedente =
                        '<a href="liturgia.html?n=' +
                        prev_i +
                        '">' +
                        liturgie[prev_i].momento +
                        '</a>';
                }

                let successivo;

                if (next_i === -1) {
                    successivo = '<a href="index.html">-</a>';
                } else {
                    successivo =
                        '<a href="liturgia.html?n=' +
                        next_i +
                        '">' +
                        liturgie[next_i].momento +
                        '</a>';
                }

                document.getElementById("footer").innerHTML =
                    precedente +
                    '<a href="index.html">Indice</a>' +
                    successivo;

            })
            .catch(() => {

                document.getElementById("header").innerHTML =
                    corrente.momento;

                document.getElementById("contenuto").innerHTML =
                    "<h2>Canto non trovato</h2>";

            });

    })
    .catch(() => {

        document.getElementById("contenuto").innerHTML =
            "<h2>Errore nel caricamento della liturgia</h2>";

    });

</script>

</body>
</html>
