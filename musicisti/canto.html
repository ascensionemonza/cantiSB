<!DOCTYPE html>
<html lang="it">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Spartito</title>

<style>

html,
body{
    margin:0;
    padding:0;
    height:100%;
    font-family:Arial,sans-serif;
}

body{
    display:flex;
    flex-direction:column;
}

#titolo{
    text-align:center;
    padding:10px;
    font-size:22px;
    font-weight:bold;
    background:#f5f5f5;
    border-bottom:1px solid #ddd;
}

#viewer{
    flex:1;
    overflow:auto;
}

#viewer iframe{
    width:100%;
    height:100%;
    border:none;
}

#viewer img{
    display:block;
    max-width:100%;
    height:auto;
    margin:auto;
}

.button-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:5px 10px;
    width:100%;
    max-width:500px;
    margin:10px auto;
}

.button-grid a{
    display:block;
    padding:12px 0;
    text-align:center;
    background-color:#BF8F00;
    color:white;
    text-decoration:none;
    border-radius:80px;
    font-size:16px;
    font-weight:normal;
}

.button-grid a:hover{
    background-color:#00b300;
    color:white;
}

</style>

</head>

<body>

<!--
<div id="titolo">
    TITOLO
</div>
-->

<div id="viewer">
    Caricamento...
</div>

<div class="button-grid">
    <a href="javascript:history.back()">Indietro</a>
    <a href="index.html">Indice</a>
    <a href="numeri.html">Indice numerico</a>
</div>

<script>

const params = new URLSearchParams(window.location.search);
let n = params.get("n");

/*
 * FUTURO:
 * false = spartito principale
 * true = accordi
 */
const usaAccordi = localStorage.getItem("accordi") === "true";

if (n) {

    n = n.toUpperCase();

    let chiave;

    if (/^[A-Z]/.test(n)) {

        const lettera = n.charAt(0);
        const numero = n.substring(1).padStart(2, "0");

        chiave = lettera + numero;

    } else {

        chiave = n.padStart(3, "0");

    }

    fetch("elenco.json")

        .then(response => response.json())

        .then(elenco => {

            let pdf = elenco[chiave];

            /*
            FUTURO

            if (usaAccordi && elenco[chiave + "a"]) {
                pdf = elenco[chiave + "a"];
            }
            */

            if (!pdf) {

                document.getElementById("viewer").innerHTML =
                    `<h2 style="text-align:center">Spartito non trovato (${chiave})</h2>`;

                return;

            }

            const viewer = document.getElementById("viewer");

            const url = pdf +
                (pdf.includes("?") ? "&" : "?") +
                "_t=" + Date.now();

            const percorsoPulito = pdf
                .split("?")[0]
                .toLowerCase();

            if (
                percorsoPulito.endsWith(".jpg") ||
                percorsoPulito.endsWith(".jpeg") ||
                percorsoPulito.endsWith(".png") ||
                percorsoPulito.endsWith(".webp")
            ) {

                viewer.innerHTML =
                    `<img src="${url}" alt="${chiave}">`;

            } else {

                viewer.innerHTML =
                    `<iframe src="${url}"></iframe>`;

            }

        })

        .catch(error => {

            console.error(error);

            document.getElementById("viewer").innerHTML =
                "<h2 style='text-align:center'>Errore nel caricamento di elenco.json</h2>";

        });

} else {

    document.getElementById("viewer").innerHTML =
        "<h2 style='text-align:center'>Nessun parametro ricevuto.</h2>";

}

</script>

</body>

</html>
