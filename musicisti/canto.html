<!DOCTYPE html>
<html lang="it">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Spartito</title>

<style>

html,
body {
    margin: 0;
    padding: 0;
    height: 100%;
    font-family: Arial, sans-serif;
}

body {
    display: flex;
    flex-direction: column;
}

.header-row {
    display: flex;
    align-items: center;
    justify-content: center;
    flex-wrap: wrap;
    gap: 10px;
    margin: 10px 0;
}

#titolo {
    color: #BF8F00;
    font-weight: bold;
    font-size: 1.4em;
}

#formati {
    display: flex;
    gap: 5px;
    align-items: center;
}

#formati a {
    display: block;
    padding: 6px 12px;
    text-align: center;
    background-color: #BF8F00;
    color: white;
    text-decoration: none;
    border-radius: 80px;
    font-size: 14px;
    font-weight: normal;
}

#formati a:hover {
    background-color: #00b300;
}

#formati a.attivo {
    background-color: #00b300;
}

#viewer {
    flex: 1;
    overflow: auto;
}

#viewer iframe {
    width: 100%;
    height: 100%;
    border: none;
}

#viewer img {
    display: block;
    max-width: 100%;
    height: auto;
    margin: auto;
}

.button-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 5px 10px;
    width: 100%;
    max-width: 500px;
    margin: 10px auto;
}

.button-grid a {
    display: block;
    padding: 12px 0;
    text-align: center;
    background-color: #BF8F00;
    color: white;
    text-decoration: none;
    border-radius: 80px;
    font-size: 16px;
    font-weight: normal;
}

.button-grid a:hover {
    background-color: #00b300;
}

</style>

</head>

<body>

<div class="header-row">

    <div id="titolo"></div>

    <div id="formati"></div>

</div>

<div id="viewer">
    Caricamento...
</div>

<div class="button-grid">
    <a href="javascript:history.back()">Indietro</a>
    <a href="index.html">Indice</a>
    <a href="numeri.html">Indice numerico</a>
</div>

<script>

function codice(id)
{
    if (!id) return "";

    id = id.toUpperCase().trim();

    const lettera =
        id.match(/^([A-Z])\s*(\d+)$/);

    if (lettera)
    {
        return (
            lettera[1] +
            lettera[2].padStart(2, "0")
        );
    }

    if (/^\d+$/.test(id))
    {
        return id.padStart(3, "0");
    }

    return id.replace(/\s+/g, "");
}

const params =
    new URLSearchParams(window.location.search);

let n =
    params.get("n");

if (!n)
{
    document.getElementById("viewer").innerHTML =
        "<h2 style='text-align:center'>Nessun parametro ricevuto.</h2>";
}
else
{
    document.getElementById(
        "titolo"
    ).textContent =
        n;

    const chiave =
        codice(n);

fetch("elenco.json")
    .then(response => response.json())
    .then(elenco =>
    {

console.log("n =", n);
console.log("chiave =", chiave);
console.log("primo id =", elenco.spartiti[0].id);

        const documenti =
            elenco.spartiti.filter(
                x => x.id === chiave
            );

        if (documenti.length === 0)
        {
            document.getElementById(
                "viewer"
            ).innerHTML =
                `<h2 style="text-align:center">
                    Spartito non trovato (${chiave})
                </h2>`;

            return;
        }

        const formatoSalvato =
            localStorage.getItem(
                "formatoMusici"
            ) || "";

        let documentoAttivo =
            documenti.find(
                x => x.tipo_file === formatoSalvato
            );

        if (!documentoAttivo)
        {
            documentoAttivo =
                documenti.find(
                    x => x.tipo_file === ""
                ) || documenti[0];
        }

        const pulsanti = [];

        if (documenti.length > 1)
        {
            documenti.forEach(doc =>
            {
                const etichetta =
                    doc.tipo_file || "spartito";

                pulsanti.push(
                    `<a
                        href="#"
                        data-formato="${doc.tipo_file}"
                        class="${
                            doc === documentoAttivo
                                ? "attivo"
                                : ""
                        }">
                        ${etichetta}
                    </a>`
                );
            });
        }

        document.getElementById(
            "formati"
        ).innerHTML =
            pulsanti.join("");

        document
            .querySelectorAll(
                "#formati a"
            )
            .forEach(btn =>
            {
                btn.addEventListener(
                    "click",
                    e =>
                    {
                        e.preventDefault();

                        localStorage.setItem(
                            "formatoMusici",
                            btn.dataset.formato
                        );

                        location.reload();
                    }
                );
            });

        const pdf =
            documentoAttivo.file;

        const viewer =
            document.getElementById(
                "viewer"
            );

        const url =
            pdf +
            (pdf.includes("?")
                ? "&"
                : "?") +
            "_t=" +
            Date.now();

        const percorsoPulito =
            pdf
                .split("?")[0]
                .toLowerCase();

        if (
            percorsoPulito.endsWith(".jpg") ||
            percorsoPulito.endsWith(".jpeg") ||
            percorsoPulito.endsWith(".png") ||
            percorsoPulito.endsWith(".webp")
        )
        {
            viewer.innerHTML =
                `<img
                    src="${url}"
                    alt="${chiave}"
                >`;
        }
        else
        {
            const pdfUrl =
                new URL(
                    pdf,
                    window.location.href
                ).href;

            viewer.innerHTML =
                `<iframe
                    src="/cantiSB/pdfjs/web/viewer.html?file=${encodeURIComponent(pdfUrl)}">
                </iframe>`;
        }
    })
    .catch(error =>
    {
        console.error(error);

        document.getElementById(
            "viewer"
        ).innerHTML =
            "<h2 style='text-align:center'>Errore nel caricamento di elenco.json</h2>";
    });
}

</script>

</body>

</html>
