<!DOCTYPE html>
<html lang="it">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body {
    font-family: Arial, sans-serif;
    display: flex;
    flex-direction: column;
    margin: 0;
    padding: 0;
}

.header-row {
    display: flex;
    align-items: center;
    justify-content: center;
    flex-wrap: wrap;
    gap: 10px;
    margin: 10px 0;
}

#header {
    color: #BF8F00;
    font-weight: bold;
    font-size: 1.4em;
    margin: 0;
}

#formati {
    display: flex;
    gap: 5px;
    align-items: center;
}

#formati a {
    display: block;
    padding: 6px 12px;
    text-align: center;
    background-color: #BF8F00;
    color: white;
    text-decoration: none;
    border-radius: 80px;
    font-size: 14px;
    font-weight: normal;
}

#formati a:hover {
    background-color: #00b300;
}

#formati a.attivo {
    background-color: #00b300;
}

#contenuto {
    width: 100%;
}

.button-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 5px 10px;
    width: 100%;
    max-width: 500px;
    margin: 10px auto;
}

.button-grid a {
    display: block;
    padding: 12px 0;
    text-align: center;
    background-color: #BF8F00;
    color: white;
    text-decoration: none;
    border-radius: 80px;
    font-size: 16px;
    font-weight: normal;
}

.button-grid a:hover {
    background-color: #00b300;
}

.button-grid a.attivo {
    background-color: #00b300;
}

</style>

</head>

<body>

<div class="header-row">

    <div id="header"></div>

    <div id="formati"></div>

</div>

<div id="contenuto"></div>

<div id="footer" class="button-grid"></div>

<script>

function codice(id)
{
    if (!id) return "";

    id = id.toUpperCase().trim();

    const lettera =
        id.match(/^([A-Z])\s*(\d+)$/);

    if (lettera)
    {
        return (
            lettera[1] +
            lettera[2].padStart(2, "0")
        );
    }

    if (/^\d+$/.test(id))
    {
        return id.padStart(3, "0");
    }

    return id.replace(/\s+/g, "");
}

const params =
    new URLSearchParams(location.search);

const indice =
    parseInt(params.get("n"));

fetch(
    "../config/liturgie.json?nocache=" +
    Date.now()
)
.then(response => response.json())
.then(liturgieData =>
{
    const liturgie =
        liturgieData.liturgie;

    const corrente =
        liturgie[indice];

    document.getElementById(
        "header"
    ).textContent =
        corrente.momento.toUpperCase();

    fetch("elenco.json")
        .then(r => r.json())
        .then(elenco =>
        {
            const chiave =
                codice(
                    corrente.canto
                );


const documenti =
    elenco.spartiti.filter(
        x => x.id === chiave
    );

const formatoSalvato =
    localStorage.getItem(
        "formatoMusici"
    ) || "";

let documentoAttivo =
    documenti.find(
        x => x.tipo_file === formatoSalvato
    );

if (!documentoAttivo)
{
    documentoAttivo =
        documenti.find(
            x => x.tipo_file === ""
        ) || documenti[0];
}

const pulsanti = [];

if (documenti.length > 1)
{
    documenti.forEach(doc =>
    {
        const etichetta =
            doc.tipo_file || "spartito";

        pulsanti.push(
            `<a
                href="#"
                data-formato="${doc.tipo_file}"
                class="${
                    doc === documentoAttivo
                        ? "attivo"
                        : ""
                }">
                ${etichetta}
            </a>`
        );
    });
}

document.getElementById(
    "formati"
).innerHTML =
    pulsanti.join("");

document
    .querySelectorAll(
        "#formati a"
    )
    .forEach(btn =>
    {
        btn.addEventListener(
            "click",
            e =>
            {
                e.preventDefault();

                localStorage.setItem(
                    "formatoMusici",
                    btn.dataset.formato
                );

                location.reload();
            }
        );
    });

const pdf =
    documentoAttivo
        ? documentoAttivo.file
        : null;

            if (!pdf)
            {
                document.getElementById(
                    "contenuto"
                ).innerHTML =
                    `<h2>
                        Spartito non trovato
                        (${chiave})
                    </h2>`;

                return;
            }

            const container =
                document.getElementById(
                    "contenuto"
                );

            const percorsoPulito =
                pdf
                .split("?")[0]
                .toLowerCase();

            if (
                percorsoPulito.endsWith(".jpg") ||
                percorsoPulito.endsWith(".jpeg") ||
                percorsoPulito.endsWith(".png") ||
                percorsoPulito.endsWith(".webp")
            )
            {
                container.innerHTML =
                    `<img
                        src="${pdf}"
                        style="
                            max-width:100%;
                            height:auto;
                        "
                    >`;
            }
            else
            {
                const pdfUrl =
                    new URL(
                        pdf,
                        window.location.href
                    ).href;

                container.innerHTML =
                    `<iframe
                        src="/cantiSB/pdfjs/web/viewer.html?file=${encodeURIComponent(pdfUrl)}"
                        style="
                            width:100%;
                            height:89vh;
                            border:none;
                        ">
                    </iframe>`;
            }
        });

    let precedente = -1;

    for (
        let i = indice - 1;
        i >= 0;
        i--
    )
    {
        if (liturgie[i].canto)
        {
            precedente = i;
            break;
        }
    }

    let successivo = -1;

    for (
        let i = indice + 1;
        i < liturgie.length;
        i++
    )
    {
        if (liturgie[i].canto)
        {
            successivo = i;
            break;
        }
    }

    document.getElementById(
        "footer"
    ).innerHTML =

        (precedente < 0

            ? '<a href="index.html">-</a>'

            : `<a href="liturgia.html?n=${precedente}">
                    ${liturgie[precedente].momento}
               </a>`)

        +

        '<a href="index.html">Indice</a>'

        +

        (successivo < 0

            ? '<a href="index.html">-</a>'

            : `<a href="liturgia.html?n=${successivo}">
                    ${liturgie[successivo].momento}
               </a>`);
});

</script>

</body>
</html>
