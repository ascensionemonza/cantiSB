          <h2>Canti in ordine alfabetico</h2></span>


<div class="tutti_i_canti" id="tutti_i_canti"></div>

<script>

function iniziale(titolo) {
    return titolo
        .trim()
        .charAt(0)
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .toUpperCase();
}

fetch("../config/titoli.json")
    .then(response => response.json())
    .then(data => {

        const canti = data.canti //.filter(
//            c => c.id.trim().length === 3
//        );

        const lettere = [...new Set(
            canti.map(c => iniziale(c.titolo))
        )].sort((a, b) => a.localeCompare(b, "it"));

        document.getElementById("tutti_i_canti").innerHTML =
            lettere.map(lettera =>
                `<a href="alfabetico.html?l=${encodeURIComponent(lettera)}">${lettera}</a>`
            ).join("");
    });

</script>
