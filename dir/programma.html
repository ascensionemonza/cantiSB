<!DOCTYPE html>
<html lang="it">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body {
    font-family: Arial, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    font-size: 18px;
}

h2,
h3 {
    text-align: center;
}

.button-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 15px 20px;
    width: 100%;
    max-width: 500px;
}

.button-grid a {
    display: block;
    padding: 12px 6px;
    text-align: center;
    color: white;
    background-color: #BF8F00;
    text-decoration: none;
    border-radius: 80px;
    font-size: 16px;
}

.button-grid a:hover {
    background-color: #00b300;
}

#programma {
    width: 100%;
    max-width: 900px;
}

</style>

</head>

<body>

<h2>
<span style="color:#BF8F00">
Chiesa San Biagio<br>
Monza
</span>
</h2>

<div id="programma"></div>

<script>

function codice(id)
{
    if (!id) return "";

    id = id.toUpperCase().trim();

    const lettera =
        id.match(/^([A-Z])\s*(\d+)$/);

    if (lettera)
    {
        return (
            lettera[1] +
            lettera[2].padStart(2, "0")
        );
    }

    if (/^\d+$/.test(id))
    {
        return id.padStart(3, "0");
    }

    return id.replace(/\s+/g, "");
}

async function carica(file, div, momento)
{
    let testo = "";

    const risposta = await fetch(file);

    if (risposta.status === 404)
    {
        testo =
            "File " +
            file +
            " non trovato<br><br>";
    }
    else
    {
        testo = await risposta.text();
    }

    if (momento && momento.length > 0)
    {
        div.innerHTML +=
            "<hr><h2><span style='color:#BF8F00'>" +
            momento +
            "</span></h2><hr>";
    }

    div.innerHTML += testo;
}

async function caricaSalmo(div)
{
    const risposta =
        await fetch(
            "../config/salmo.txt?nocache=" +
            Date.now()
        );

    const testo = await risposta.text();

    const righe =
        testo.split(/\r?\n/);

    if (righe.length === 0)
        return;

    const ritornello =
        righe[0]
            .replace(/^R\.\s*/, "")
            .trim();

    let html =
        "<br><b>" +
        ritornello +
        "</b><br><br>";

    for (let i = 1; i < righe.length; i++)
    {
        let riga = righe[i];

        if (riga.trim() === "")
        {
            html += "<br>";
            continue;
        }

        if (riga.trim().endsWith("R."))
        {
            riga =
                riga.replace(
                    /\s*R\.\s*$/,
                    ""
                );

            html +=
                riga +
                "<br><br><b>" +
                ritornello +
                "</b><br><br>";
        }
        else
        {
            html += riga + "<br>";
        }
    }

    div.innerHTML +=
        "<hr><h2><span style='color:#BF8F00'>" +
        "Salmo Responsoriale" +
        "</span></h2><hr>";

    div.innerHTML += html;
}

async function crea_programma(dati)
{
    const div =
        document.getElementById(
            "programma"
        );

    div.innerHTML =
        "<h3><b>Programma del " +
        dati.data +
        "</b></h3>";

    for (const liturgia of dati.liturgie)
    {
        if (
            liturgia.momento ===
            "Salmo Responsoriale"
        )
        {
            if (!liturgia.canto)
            {
                await caricaSalmo(div);
                continue;
            }
        }

        if (!liturgia.canto)
            continue;

        const id =
            liturgia.canto.trim();

        if (id.startsWith("163."))
        {
            const base =
                id.substring(0, 3);

            const varianti =
                id.substring(4);

            await carica(
                "canti/" +
                base +
                ".0.html",
                div,
                liturgia.momento
            );

            for (
                let i = 0;
                i < varianti.length;
                i++
            )
            {
                await carica(
                    "canti/" +
                    base +
                    "." +
                    varianti.charAt(i) +
                    ".html",
                    div,
                    ""
                );
            }
        }
        else
        {
            await carica(
                "canti/" +
                codice(id) +
                ".html",
                div,
                liturgia.momento
            );
        }
    }
}

fetch(
    "../config/liturgie.json?nocache=" +
    Date.now()
)
.then(response => response.json())
.then(dati =>
{
    crea_programma(dati);
});

</script>

<br><br>

<div class="button-grid">
    <a href="index.html">Indice</a>
    <a href="numeri.html">
        Canti in ordine numerico
    </a>
</div>

<br><br>

</body>
</html>
