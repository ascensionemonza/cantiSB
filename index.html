<meta charset="UTF-8">
  <h2 style="color:#BF8F00">
  Chiesa San Biagio<br>
  Monza

  <div id="data_e_ora"></div>
  <div class="button-grid" id="programma"></div>
  <div id="contenuto"></div>

<script>

fetch("/cantiSB/config/config.txt?nocache=" + Date.now())
  .then(response => response.text())
  .then(text => {
    const config = text.split(/\r?\n/);

    const cfg = parseConfigRiga1(config[0]);

    if (isValida(cfg.giorno, cfg.mese, cfg.anno, cfg.ora, cfg.minuti)) {
      crea_programma(config);
    }
  });

function parseConfigRiga1(riga)
{
    const parti = riga.toLowerCase().split(" ");

    const giorno = parseInt(parti[0]);

    const mesi = {
        "gennaio":0,
        "febbraio":1,
        "marzo":2,
        "aprile":3,
        "maggio":4,
        "giugno":5,
        "luglio":6,
        "agosto":7,
        "settembre":8,
        "ottobre":9,
        "novembre":10,
        "dicembre":11
    };

    const mese = mesi[parti[1]];
    const anno = parseInt(parti[2]);

    const oraMinuti = parti[4];

    let ora = 0;
    let minuti = 0;

    if (oraMinuti.includes(":")) {
        const [h, m] = oraMinuti.split(":");
        ora = parseInt(h);
        minuti = parseInt(m);
    } else {
        ora = parseInt(oraMinuti);
        minuti = 0;
    }

    return { giorno, mese, anno, ora, minuti };
}

function isValida(giorno, mese, anno, ora, minuti)
{
    const dataCostante = new Date(
        anno,
        mese,
        giorno,
        ora,
        minuti
    );

    const adesso = new Date();

    const limite = new Date(
        anno,
        mese,
        giorno,
        ora,
        minuti
    );

    limite.setDate(limite.getDate() + 1);
    limite.setHours(3, 0, 0, 0);

    if (adesso <= dataCostante) return true;
    if (adesso > dataCostante && adesso <= limite) return true;

    return false;
}

function normalizzaId(id)
{
    id = id.trim().toUpperCase();

    if (/^\d+$/.test(id))
        return id.padStart(3,"0");

    return id.replace(/\s+/g,"");
}

async function crea_programma(config)
{
    const liturgieData = await fetch("liturgie.json")
        .then(r => r.json());

    const titoliData = await fetch("titoli.json")
        .then(r => r.json());

    document.getElementById("data_e_ora").innerHTML =
        "<h3>Programma del<br>" + config[0] + "</h3>";

    const liturgie = liturgieData.liturgie;

    const mioArray = config[1].split(";");

    let html = "";

for (let i = 0; i < 24; i++)
{
    const codice = mioArray[i].trim().toUpperCase();

    if (codice === "0")
        continue;

    if (codice.length > 3)
        continue;

    const canto = titoliData.canti.find(
        c => normalizzaId(c.id) === normalizzaId(codice)
    );

    if (!canto)
        continue;

    const prefisso =
        liturgieData.liturgie[i] === "Gloria"
            ? ""
            : `${liturgieData.liturgie[i]}: `;

    html += `
        <a href="liturgia.html?n=${i}">
            ${prefisso}${canto.titolo}
            (${codice})
        </a>
    `;
}
    html +=
        '<div style="text-align:center;">' +
        '<img src="NextGen.png" style="height:100px">' +
        '</div>';

    document.getElementById("programma").innerHTML = html;
}

</script>

<div class="tutti_i_canti" id="tutti_i_canti"></div>

<script>

function iniziale(titolo) {
    return titolo
        .trim()
        .charAt(0)
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .toUpperCase();
}

fetch("titoli.json")
    .then(response => response.json())
    .then(data => {

        const canti = data.canti.filter(
            c => c.id.trim().length === 3
        );

        const lettere = [...new Set(
            canti.map(c => iniziale(c.titolo))
        )].sort((a, b) => a.localeCompare(b, "it"));

        document.getElementById("tutti_i_canti").innerHTML =
            lettere.map(lettera =>
                `<a href="alfabetico.html?l=${encodeURIComponent(lettera)}">${lettera}</a>`
            ).join("");
    });

</script>

<!-- Controllo dimensione testo -->
<div id="textbox">
    
    <!-- Controllo dimensione testo dentro il textbox -->
    <div id="controlloTesto">
        <span id="aMinus" style="cursor:pointer; font-size:18px; margin-right:15px;">A</span>
        <span id="aDefault" style="cursor:pointer; font-size:22px; margin-right:15px;">A</span>
        <span id="aPlus" style="cursor:pointer; font-size:26px;">A</span>

        <p id="testoDimensione" style="margin-top:15px; font-size:16px;">
            Dimensione del testo
        </p>
    </div>

</div>


<script>
    const testo = document.getElementById("testoDimensione");

    // limiti
    const MIN = 12;
    const MAX = 30;

    // dimensione iniziale (recuperata da localStorage)
    let size = parseInt(localStorage.getItem("dimTesto")) || 18;
    testo.style.fontSize = size + "px";
aggiornaStatoA(size);

    function salvaLocale(nuovaDim) {
        localStorage.setItem("dimTesto", nuovaDim);
    }

  function aggiornaStatoA(size) {
    const aMinus = document.getElementById("aMinus");
    const aDefault = document.getElementById("aDefault");
    const aPlus = document.getElementById("aPlus");

    // Rimuove il grigio da tutte
    aMinus.classList.remove("a-disabled");
    aDefault.classList.remove("a-disabled");
    aPlus.classList.remove("a-disabled");

    // Applica il grigio in base al valore
    if (size === MIN) {
        aMinus.classList.add("a-disabled");
    } else if (size === 18) { // valore default
        aDefault.classList.add("a-disabled");
    } else if (size === MAX) {
        aPlus.classList.add("a-disabled");
    }
}


document.getElementById("aMinus").addEventListener("click", () => {
    if (size > MIN) {
        size -= 2;
        testo.style.fontSize = size + "px";
        salvaLocale(size);
    }
    aggiornaStatoA(size);
});

document.getElementById("aDefault").addEventListener("click", () => {
    size = 18;
    testo.style.fontSize = size + "px";
    salvaLocale(size);
    aggiornaStatoA(size);
});

document.getElementById("aPlus").addEventListener("click", () => {
    if (size < MAX) {
        size += 2;
        testo.style.fontSize = size + "px";
        salvaLocale(size);
    }
    aggiornaStatoA(size);
});

    
</script>
