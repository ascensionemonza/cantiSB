<!DOCTYPE html>
<html lang="it">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body {
    font-family: Arial, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    padding: 0;
    margin: 0;
}

#contenuto {
    width: 100%;
}

.button-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 5px 10px;
    width: 100%;
    max-width: 500px;
}

.button-grid a {
    display: block;
    padding: 12px 0;
    text-align: center;
    background-color: #BF8F00;
    color: white;
    text-decoration: none;
    border-radius: 80px;
    font-size: 16px;
    font-weight: normal;
}

.button-grid a:hover {
    background-color: #00b300;
    color: white;
}


#spartitoContainer {
    width: 100%;
}

#spartitoContainer iframe {
    width: 100%;
    height: 90vh;
    border: none;
}

#spartitoContainer img {
    display: block;
    max-width: 100%;
    height: auto;
    margin: auto;
}

.vista-grid {
    display: flex;
    justify-content: center;
    gap: 5px;
    width: 100%;
}

.vista-grid a {
    display: inline-block;
    padding: 6px 12px;
    text-align: center;
    background-color: #BF8F00;
    color: white;
    text-decoration: none;
    border-radius: 80px;
    font-size: 14px;
    font-weight: normal;
    cursor: pointer;
}

.vista-grid a:hover {
    background-color: #00b300;
    color: white;
}

.vista-grid a.attivo {
    background-color: #00b300;
    color: white;
}
</style>

</head>

<body>

<div id="vistaBox" style="display:none">
    <div class="vista-grid">
        <a id="btnTesto">Testo</a>
        <a id="btnSpartito">Spartito</a>
    </div>
    <br>
</div>

<div id="contenuto"></div>


<div id="spartitoContainer" style="display:none"></div>


<script src="canto.js"></script>

<script>
const n =
    new URLSearchParams(
        location.search
    ).get("n");

caricaCanto(n);
</script>

<br><br>

<div class="button-grid">
    <a href="javascript:history.back()">Indietro</a>
    <a href="index.html">Indice</a>
    <a href="numeri.html">Indice numerico</a>
</div>

<br><br>

</body>
</html>
